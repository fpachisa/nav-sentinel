agent_id: settlement-investigator
version: 1.4.0
display_name: Trade & Settlement Investigator
owner: fund-accounting-platform
description: >
  Resolves breaks caused by trade lifecycle timing: trade-date versus settlement-date
  recognition, failed and partially filled trades, and allocation errors. Distinguishes
  genuine errors from legitimate timing differences that require a reconciling item
  rather than a correcting entry.

handles_categories: [settlement]
model: gemini-3.7-flash

allowed_tools:
  - books_and_records.positions
  - books_and_records.trades
  - books_and_records.trades_for_security
  - books_and_records.security

data_scopes:
  read: [positions, trades, securities]
  write: []

authority:
  may_propose_remediation: false
  may_post_entries: false
  max_autonomous_bps: 0.0

untrusted_inputs: false
requires_model_armor: false

sla:
  target_latency_seconds: 60
