agent_id: triage-agent
version: 2.0.0
display_name: Triage & Materiality Agent
owner: fund-accounting-platform
description: >
  Classifies each exception case into a root-cause family, then queries the Agent Registry
  to discover which specialist is authorised to investigate it. Materiality and approval
  class are computed deterministically, not inferred.

handles_categories: [unclassified]
model: gemini-3.5-flash-lite   # every break passes through here, so cost per call matters

allowed_tools:
  - registry.discover_for_category
  - registry.coverage
  - books_and_records.security
  # memory.recall_recurrence is added in S2, together with the tool itself. A manifest must
  # not declare a capability the catalogue cannot resolve.

data_scopes:
  read: [securities, registry]
  write: [exception_cases]

authority:
  may_propose_remediation: false
  may_post_entries: false
  max_autonomous_bps: 0.0

untrusted_inputs: false
requires_model_armor: false

sla:
  target_latency_seconds: 15
