[project]
name = "nav-sentinel"
version = "0.1.0"
description = "A governed agent fleet that clears fund-accounting reconciliation exceptions inside the NAV window."
requires-python = ">=3.12"
dependencies = [
    "google-adk>=2.7.1",
    "google-genai>=2.18.0",
    "google-cloud-aiplatform>=1.164.0",
    "google-cloud-firestore>=2.19.0",
    "google-cloud-pubsub>=2.23.0",
    "google-cloud-modelarmor>=0.1.0",
    "google-cloud-trace>=1.13.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27.0",
    "opentelemetry-resourcedetector-gcp>=1.7.0a0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.2",
    "rich>=13.9.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "pytest-asyncio>=0.24.0", "ruff>=0.7.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nav_sentinel"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
