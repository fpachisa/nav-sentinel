[project]
name = "nav-sentinel"
version = "0.1.0"
description = "A governed agent fleet that clears fund-accounting reconciliation exceptions inside the NAV window."
requires-python = ">=3.12"
dependencies = [
    "google-adk>=2.7.1",
    "google-genai>=2.18.0",
    "google-cloud-aiplatform>=1.164.0",
    # Upper bound, and the reason is a deployed-only failure. The container resolved 2.29.0 while
    # this project is tested against 2.28.1, and 2.29 rejects the default database on a *query*:
    # `InvalidArgument: 400 Invalid database id %28default%29`. Document reads still worked, so the
    # exception desk loaded and only the pages that run a query returned 500 -- which is the worst
    # shape of failure, since a smoke test that fetches one document passes.
    #
    # The general lesson is bigger than the bound: an unpinned dependency means the artefact that
    # was deployed is not the artefact that was tested, and the difference surfaces in production.
    "google-cloud-firestore>=2.19.0,<2.29.0",
    "google-cloud-pubsub>=2.23.0",
    "google-cloud-modelarmor>=0.1.0",
    "google-cloud-trace>=1.13.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27.0",
    "opentelemetry-resourcedetector-gcp>=1.7.0a0",
    "fastapi>=0.115.0",
    # Explicit, not inherited. FastAPI needs it for `Form(...)` -- the exception desk's sign-in and
    # approval posts -- but only declares it under its `standard` extra, which this project does not
    # install. It was present locally as somebody else's transitive dependency, which would have
    # held right up until the container was built without it and the service failed at import.
    "python-multipart>=0.0.18",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.2",
    "rich>=13.9.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "pytest-asyncio>=0.24.0", "ruff>=0.7.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nav_sentinel"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# The default rule set is E4/E7/E9/F only, which is why an unused function argument sat in a
# policy signature reading as though P-003 consulted the band. "Lint clean" should mean more
# than "syntactically valid".
select = ["E", "F", "W", "I", "B", "SIM", "ARG", "RET", "C4", "UP", "PL", "FURB"]
ignore = [
    "PLR0913",  # policy functions legitimately take several collaborators
    "PLR0917",  # ditto, positionally
    "PLR2004",  # threshold literals in tests are the point of the test
    "E501",     # line length is handled by the formatter setting above
    # Local imports are deliberate in three places: breaking an import cycle (audit -> gateway),
    # deferring a heavy SDK until it is needed (ADK, Model Armor), and keeping the composition
    # root's process imports inside the function that registers them.
    "PLC0415",
    # Module-level caches with documented invalidation: the discovery catalogue, the tracing
    # provider flag, the decision log, the EDGAR throttle. Each is deliberate and commented.
    "PLW0603",
]

[tool.ruff.lint.per-file-ignores]
# Nested `with identity.acting_as(...)` / `with pytest.raises(...)` reads more clearly than a
# combined statement: the identity binding is the setup and the raises is the assertion.
# ARG005: stub lambdas exist precisely to ignore their arguments.
# E731: a named lambda is the clearest way to express a one-line exploit probe.
"tests/**" = ["SIM117", "ARG005", "E731", "ARG002"]
# The generator is one long deliberate script: each seeded scenario is a named block, and
# splitting them into helpers would hide the very thing a reviewer needs to read straight down.
"fixtures/generate.py" = ["PLR0915"]
# The diagram checker's branches are one per check, which is the clearest form it can take.
"scripts/check_diagrams.py" = ["PLR0912"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = [
    "live: requires live Google Cloud credentials and network access",
]
addopts = "-m 'not live'"

[tool.ruff.lint.flake8-bugbear]
# `Depends(...)` in an argument default is how FastAPI declares a dependency; the call is
# evaluated once at import and the result is never mutated, so B008's mutable-default concern
# does not apply. Naming it here keeps B008 live for every other call.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header", "fastapi.Query"]
