<svg xmlns="http://www.w3.org/2000/svg" color="#10151C" font-family="Archivo, Helvetica Neue, Arial, sans-serif" viewBox="0 0 1040 340" role="img"
        aria-label="An agent emits a tool name and arguments. The gateway resolves identity from context, reads the manifest from the registry, checks the allowlist and data scope, resolves the name to a callable in a frozen catalogue, executes it, and screens the result if the tool is marked untrusted. Denials at any step are recorded and raised.">
        <title>NAV Sentinel — what happens to a tool call</title>
  <defs>
          <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
          </marker>
          <marker id="bd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0 0 L10 5 L0 10 z" fill="#A8322A"/>
          </marker>
        </defs>
        <rect x="0" y="0" width="1040" height="340" fill="#F1F4F7"/>

        <rect x="24" y="96" width="130" height="58" rx="3" fill="none" stroke="currentColor" stroke-width="1.4"/>
        <text x="89" y="120" font-family="Archivo, sans-serif" font-size="12" fill="currentColor" text-anchor="middle">Investigator</text>
        <text x="89" y="136" font-family="JetBrains Mono, monospace" font-size="8.5" fill="#7C8894" text-anchor="middle">no tool imports</text>

        <rect x="196" y="40" width="700" height="170" rx="3" fill="#E6EFF6" stroke="#1F5C8B" stroke-width="1.8"/>
        <text x="212" y="62" font-family="Archivo, sans-serif" font-size="11" font-weight="700" fill="#1F5C8B" letter-spacing=".08em">GATEWAY</text>

        <g fill="none" stroke="#1F5C8B" stroke-width="1.2">
          <rect x="216" y="88" width="118" height="76" rx="2"/>
          <rect x="356" y="88" width="118" height="76" rx="2"/>
          <rect x="496" y="88" width="118" height="76" rx="2"/>
          <rect x="636" y="88" width="118" height="76" rx="2"/>
          <rect x="776" y="88" width="104" height="76" rx="2"/>
        </g>
        <g font-family="JetBrains Mono, monospace" font-size="8" fill="#1F5C8B" text-anchor="middle">
          <text x="275" y="104">1</text><text x="415" y="104">2</text><text x="555" y="104">3</text>
          <text x="695" y="104">4</text><text x="828" y="104">5</text>
        </g>
        <g font-family="Archivo, sans-serif" font-size="11" fill="#1F5C8B" text-anchor="middle" font-weight="600">
          <text x="275" y="124">identity</text>
          <text x="415" y="124">manifest</text>
          <text x="555" y="124">policy</text>
          <text x="695" y="124">resolve</text>
          <text x="828" y="124">screen</text>
        </g>
        <g font-family="JetBrains Mono, monospace" font-size="8" fill="#1F5C8B" text-anchor="middle">
          <text x="275" y="140">from context,</text><text x="275" y="150">never an argument</text>
          <text x="415" y="140">read from the</text><text x="415" y="150">published registry</text>
          <text x="555" y="140">P-001 allowlist</text><text x="555" y="150">P-006 data scope</text>
          <text x="695" y="140">name to callable,</text><text x="695" y="150">frozen catalogue</text>
          <text x="828" y="140">if the tool is</text><text x="828" y="150">marked untrusted</text>
        </g>

        <rect x="938" y="96" width="86" height="58" rx="3" fill="none" stroke="currentColor" stroke-width="1.4"/>
        <text x="981" y="120" font-family="Archivo, sans-serif" font-size="12" fill="currentColor" text-anchor="middle">Data</text>
        <text x="981" y="136" font-family="JetBrains Mono, monospace" font-size="8.5" fill="#7C8894" text-anchor="middle">read-only</text>

        <g stroke="currentColor" stroke-width="1.4" fill="none" marker-end="url(#b)">
          <line x1="154" y1="125" x2="210" y2="125"/>
          <line x1="880" y1="125" x2="932" y2="125"/>
        </g>
        <text x="174" y="112" font-family="JetBrains Mono, monospace" font-size="8" fill="#7C8894" text-anchor="middle">name</text>
        <text x="174" y="146" font-family="JetBrains Mono, monospace" font-size="8" fill="#7C8894" text-anchor="middle">+ args</text>

        <g stroke="#1F5C8B" stroke-width="1" fill="none" marker-end="url(#b)" color="#1F5C8B">
          <line x1="334" y1="126" x2="352" y2="126"/>
          <line x1="474" y1="126" x2="492" y2="126"/>
          <line x1="614" y1="126" x2="632" y2="126"/>
          <line x1="754" y1="126" x2="772" y2="126"/>
        </g>

        <line x1="555" y1="164" x2="555" y2="278" stroke="#A8322A" stroke-width="1.5" fill="none" marker-end="url(#bd)"/>
        <text x="568" y="232" font-family="JetBrains Mono, monospace" font-size="9" fill="#A8322A">deny → recorded, then raised</text>
        <text x="568" y="246" font-family="JetBrains Mono, monospace" font-size="8" fill="#A8322A">a refused call leaves no ALLOW in the log</text>

        <rect x="24" y="284" width="1000" height="32" rx="3" fill="none" stroke="#7C8894" stroke-width="1.1" stroke-dasharray="4 3"/>
        <text x="40" y="305" font-family="JetBrains Mono, monospace" font-size="9" fill="#46525F">Governance log — the decision names the tool that executed, not the label the caller supplied</text>
            </svg>
