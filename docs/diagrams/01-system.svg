<svg xmlns="http://www.w3.org/2000/svg" color="#10151C" font-family="Archivo, Helvetica Neue, Arial, sans-serif" viewBox="0 0 1040 830" role="img"
        aria-label="A deployment diagram. On the left, Pub/Sub topic nav-exceptions feeds a push subscription authenticated with an OIDC token, which posts to a Cloud Run service; undelivered messages go to a dead-letter topic. An operator CLI is a second entry point. In the centre, the Cloud Run service nav-sentinel runs as service account nav-runtime and contains interchangeable process packs, a fleet of ADK agents discovered from the Agent Registry, and a full-width control plane band holding the registry, agent identity and the Agent Gateway with seven policies. On the right, Google Cloud services: Vertex AI serving Gemini from location global, Model Armor on its regional endpoint, Firestore holding four collections of state, and Cloud Trace. Along the bottom, external sources of truth and the build path from Cloud Build through Artifact Registry.">
        <title>NAV Sentinel — deployed architecture on Google Cloud</title>
  <defs>
          <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
          </marker>
          <marker id="bd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0 0 L10 5 L0 10 z" fill="#A8322A"/>
          </marker>
          <marker id="bf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M0 0 L10 5 L0 10 z" fill="#7C8894"/>
          </marker>
        </defs>
        <rect x="0" y="0" width="1040" height="830" fill="#F1F4F7"/>

        <!-- ============ column headings ============ -->
        <g font-family="JetBrains Mono, monospace" font-size="8.5" fill="#7C8894" letter-spacing=".8">
          <text x="30" y="30">TRIGGERS</text>
          <text x="292" y="30">COMPUTE · ONE CONTAINER</text>
          <text x="800" y="30">MANAGED GOOGLE CLOUD SERVICES</text>
        </g>

        <!-- ============ left column: triggers ============ -->
        <g fill="none" stroke="currentColor" stroke-width="1.3">
          <rect x="30" y="42" width="216" height="52" rx="3"/>
          <rect x="30" y="122" width="216" height="76" rx="3"/>
          <rect x="30" y="300" width="216" height="58" rx="3"/>
        </g>
        <rect x="30" y="214" width="216" height="52" rx="3" fill="none" stroke="#A8322A" stroke-width="1.3" stroke-dasharray="5 3"/>

        <g font-family="Archivo, sans-serif" font-size="12.5" fill="currentColor">
          <text x="42" y="64">Pub/Sub topic</text>
          <text x="42" y="146">Push subscription</text>
          <text x="42" y="322">Operator CLI</text>
        </g>
        <text x="42" y="236" font-family="Archivo, sans-serif" font-size="12.5" fill="#A8322A">Dead-letter topic</text>
        <g font-family="JetBrains Mono, monospace" font-size="8.5" fill="#7C8894">
          <text x="42" y="81">nav-exceptions</text>
          <text x="42" y="162">OIDC token · aud = service URL</text>
          <text x="42" y="176">SA nav-pubsub-push</text>
          <text x="42" y="190">POST /pubsub/exceptions</text>
          <text x="42" y="339">make investigate · approve · ta</text>
        </g>
        <text x="42" y="253" font-family="JetBrains Mono, monospace" font-size="8.5" fill="#A8322A">nav-exceptions-dlq · 5 attempts</text>

        <line x1="138" y1="94" x2="138" y2="118" stroke="currentColor" stroke-width="1.3" marker-end="url(#b)"/>
        <line x1="138" y1="198" x2="138" y2="210" stroke="#A8322A" stroke-width="1.3" marker-end="url(#bd)"/>

        <!-- into the container -->
        <path d="M246 160 H278" stroke="currentColor" stroke-width="1.4" fill="none" marker-end="url(#b)"/>
        <path d="M246 329 H278" stroke="currentColor" stroke-width="1.4" fill="none" marker-end="url(#b)"/>

        <!-- ============ centre: the Cloud Run service ============ -->
        <rect x="282" y="42" width="470" height="578" rx="4" fill="none" stroke="currentColor" stroke-width="1.8"/>
        <text x="296" y="64" font-family="Archivo, sans-serif" font-size="13.5" font-weight="700" fill="currentColor">Cloud Run · nav-sentinel</text>
        <text x="296" y="80" font-family="JetBrains Mono, monospace" font-size="8.5" fill="#7C8894">SA nav-runtime · --no-allow-unauthenticated · no secrets in image</text>

        <!-- process packs: the generic seam -->
        <rect x="296" y="94" width="442" height="86" rx="3" fill="none" stroke="#7C8894" stroke-width="1.1" stroke-dasharray="4 3"/>
        <text x="308" y="112" font-family="JetBrains Mono, monospace" font-size="8.5" fill="#7C8894" letter-spacing=".8">PROCESS PACKS · INTERCHANGEABLE</text>
        <g fill="none" stroke="currentColor" stroke-width="1.2">
          <rect x="308" y="120" width="208" height="48" rx="2"/>
          <rect x="530" y="120" width="196" height="48" rx="2"/>
        </g>
        <g font-family="Archivo, sans-serif" font-size="11.5" fill="currentColor">
          <text x="318" y="139">Fund accounting</text>
          <text x="540" y="139">Transfer agency</text>
        </g>
        <g font-family="JetBrains Mono, monospace" font-size="8" fill="#7C8894">
          <text x="318" y="155">nav · bps thresholds</text>
          <text x="540" y="155">ta · unit thresholds</text>
        </g>
        <text x="318" y="165" font-family="JetBrains Mono, monospace" font-size="7.5" fill="#7C8894">tools · prompts · manifests</text>
        <text x="540" y="165" font-family="JetBrains Mono, monospace" font-size="7.5" fill="#7C8894">tools · prompts · manifests</text>

        <!-- the fleet -->
        <rect x="296" y="196" width="442" height="96" rx="3" fill="none" stroke="currentColor" stroke-width="1.3"/>
        <text x="308" y="216" font-family="Archivo, sans-serif" font-size="12.5" fill="currentColor">The fleet — ADK 2.0 agents</text>
        <text x="308" y="232" font-family="JetBrains Mono, monospace" font-size="8.5" fill="#7C8894">one manifest each · discovered by capability, never named in code</text>
        <g fill="none" stroke="#7C8894" stroke-width="1.1">
          <rect x="308" y="242" width="134" height="38" rx="2"/>
          <rect x="452" y="242" width="134" height="38" rx="2"/>
          <rect x="596" y="242" width="130" height="38" rx="2"/>
        </g>
        <g font-family="JetBrains Mono, monospace" font-size="8.5" fill="#46525F" text-anchor="middle">
          <text x="375" y="259">classify</text>
          <text x="519" y="259">investigate</text>
          <text x="661" y="259">draft</text>
          <text x="375" y="272">cheap model</text>
          <text x="519" y="272">cites evidence</text>
          <text x="661" y="272">cannot post</text>
        </g>

        <line x1="517" y1="180" x2="517" y2="192" stroke="#7C8894" stroke-width="1.1" marker-end="url(#bf)"/>
        <line x1="517" y1="292" x2="517" y2="316" stroke="currentColor" stroke-width="1.4" marker-end="url(#b)"/>
        <text x="527" y="308" font-family="JetBrains Mono, monospace" font-size="8.5" fill="#7C8894">call_tool(name, args)</text>

        <!-- control plane band -->
        <rect x="296" y="320" width="442" height="166" rx="3" fill="#E6EFF6" stroke="#1F5C8B" stroke-width="1.8"/>
        <text x="308" y="340" font-family="Archivo, sans-serif" font-size="12.5" font-weight="700" fill="#1F5C8B" letter-spacing=".04em">CONTROL PLANE — PROCESS-AGNOSTIC</text>
        <g fill="none" stroke="#1F5C8B" stroke-width="1.2">
          <rect x="308" y="350" width="140" height="42" rx="2"/>
          <rect x="458" y="350" width="128" height="42" rx="2"/>
          <rect x="596" y="350" width="130" height="42" rx="2"/>
          <rect x="308" y="404" width="418" height="74" rx="2"/>
        </g>
        <g font-family="Archivo, sans-serif" font-size="11" fill="#1F5C8B" text-anchor="middle">
          <text x="378" y="367">Agent Registry</text>
          <text x="522" y="367">Agent Identity</text>
          <text x="661" y="367">Observations</text>
        </g>
        <g font-family="JetBrains Mono, monospace" font-size="8" fill="#1F5C8B" text-anchor="middle">
          <text x="378" y="382">manifests · authority</text>
          <text x="522" y="382">one SA per agent</text>
          <text x="661" y="382">evidence, digested</text>
        </g>
        <text x="517" y="422" font-family="Archivo, sans-serif" font-size="12.5" font-weight="700" fill="#1F5C8B" text-anchor="middle">AGENT GATEWAY — the only path to data</text>
        <text x="517" y="438" font-family="JetBrains Mono, monospace" font-size="8.5" fill="#1F5C8B" text-anchor="middle">resolves every tool by name · records every decision</text>
        <text x="517" y="456" font-family="JetBrains Mono, monospace" font-size="8" fill="#1F5C8B" text-anchor="middle">P-001 allowlist · P-002 drafting · P-003 no autonomous posting</text>
        <text x="517" y="469" font-family="JetBrains Mono, monospace" font-size="8" fill="#1F5C8B" text-anchor="middle">P-004 approval route · P-005 ingest · P-006 scope · P-007 evidence</text>

        <!-- human approval, inside the container but outside the fleet's authority -->
        <rect x="296" y="504" width="442" height="46" rx="3" fill="none" stroke="#A8322A" stroke-width="1.6"/>
        <text x="517" y="524" font-family="Archivo, sans-serif" font-size="12" font-weight="700" fill="#A8322A" text-anchor="middle">Human approval gate — four eyes</text>
        <text x="517" y="540" font-family="JetBrains Mono, monospace" font-size="8" fill="#A8322A" text-anchor="middle">no agent in the fleet may post; posting without a recorded approval is refused</text>
        <line x1="517" y1="486" x2="517" y2="500" stroke="#A8322A" stroke-width="1.4" marker-end="url(#bd)"/>

        <text x="296" y="576" font-family="JetBrains Mono, monospace" font-size="8.5" fill="#7C8894">Application Default Credentials from the metadata server — no API keys anywhere in the system</text>
        <text x="296" y="592" font-family="JetBrains Mono, monospace" font-size="8.5" fill="#7C8894">FastAPI · uvicorn · python 3.12 · google-adk 2.7 · google-genai 2.18</text>
        <text x="296" y="608" font-family="JetBrains Mono, monospace" font-size="8.5" fill="#7C8894">Adding a process: register one pack. No control-plane change.</text>

        <!-- ============ right column: managed services ============ -->
        <g fill="none" stroke="currentColor" stroke-width="1.3">
          <rect x="800" y="42" width="210" height="96" rx="3"/>
          <rect x="800" y="158" width="210" height="76" rx="3"/>
          <rect x="800" y="254" width="210" height="150" rx="3"/>
          <rect x="800" y="424" width="210" height="76" rx="3"/>
        </g>

        <text x="812" y="64" font-family="Archivo, sans-serif" font-size="12.5" fill="currentColor">Vertex AI</text>
        <g font-family="JetBrains Mono, monospace" font-size="8.5" fill="#7C8894">
          <text x="812" y="81">generateContent · ADC</text>
          <text x="812" y="93">GOOGLE_CLOUD_LOCATION=global</text>
          <text x="812" y="109">(Gemini 3.x is global-only)</text>
          <text x="812" y="121">gemini-3.7-flash · reason</text>
          <text x="812" y="133">gemini-3.5-flash-lite · classify</text>
        </g>

        <text x="812" y="180" font-family="Archivo, sans-serif" font-size="12.5" fill="currentColor">Model Armor</text>
        <g font-family="JetBrains Mono, monospace" font-size="8.5" fill="#7C8894">
          <text x="812" y="197">screen() before extraction</text>
          <text x="812" y="209">modelarmor.us-central1.rep</text>
          <text x="812" y="225">regional endpoint only</text>
        </g>

        <text x="812" y="276" font-family="Archivo, sans-serif" font-size="12.5" fill="currentColor">Firestore — where state lives</text>
        <text x="812" y="292" font-family="JetBrains Mono, monospace" font-size="8" fill="#7C8894">native mode · us-central1</text>
        <g font-family="JetBrains Mono, monospace" font-size="8.5" fill="#46525F">
          <text x="812" y="312">nav_cases</text>
          <text x="812" y="330">nav_observations</text>
          <text x="812" y="348">nav_decisions</text>
          <text x="812" y="366">nav_approvals</text>
        </g>
        <g font-family="JetBrains Mono, monospace" font-size="8" fill="#7C8894">
          <text x="906" y="312">current state</text>
          <text x="906" y="330">append-only</text>
          <text x="906" y="348">append-only</text>
          <text x="906" y="366">append-only</text>
        </g>
        <text x="812" y="388" font-family="JetBrains Mono, monospace" font-size="8" fill="#7C8894">read + append · create(), never set()</text>

        <text x="812" y="446" font-family="Archivo, sans-serif" font-size="12.5" fill="currentColor">Cloud Trace</text>
        <g font-family="JetBrains Mono, monospace" font-size="8.5" fill="#7C8894">
          <text x="812" y="463">OTLP · telemetry.googleapis.com</text>
          <text x="812" y="475">one trace per case</text>
          <text x="812" y="491">flushed in-request (CPU throttle)</text>
        </g>

        <!-- centre to services -->
        <g stroke="currentColor" stroke-width="1.4" fill="none" marker-end="url(#b)">
          <path d="M752 90 H796"/>
          <path d="M752 196 H796"/>
          <path d="M752 330 H796"/>
        </g>
        <path d="M752 462 H796" stroke="#7C8894" stroke-width="1.2" fill="none" marker-end="url(#bf)"/>

        <!-- ============ bottom: external truth and build ============ -->
        <text x="30" y="632" font-family="JetBrains Mono, monospace" font-size="8.5" fill="#7C8894" letter-spacing=".8">EXTERNAL SOURCES OF TRUTH</text>
        <g fill="none" stroke="currentColor" stroke-width="1.3">
          <rect x="30" y="658" width="234" height="66" rx="3"/>
        </g>
        <rect x="284" y="658" width="234" height="66" rx="3" fill="none" stroke="#A8322A" stroke-width="1.3" stroke-dasharray="5 3"/>
        <text x="42" y="678" font-family="Archivo, sans-serif" font-size="12" fill="currentColor">ECB reference rates</text>
        <g font-family="JetBrains Mono, monospace" font-size="8.5" fill="#7C8894">
          <text x="42" y="695">data-api.ecb.europa.eu</text>
          <text x="42" y="709">structured · authoritative</text>
        </g>
        <text x="296" y="678" font-family="Archivo, sans-serif" font-size="12" fill="#A8322A">SEC EDGAR filings</text>
        <g font-family="JetBrains Mono, monospace" font-size="8.5" fill="#A8322A">
          <text x="296" y="695">untrusted prose · quarantined</text>
          <text x="296" y="709">screened, then extracted unprivileged</text>
        </g>

        <path d="M330 620 V644 H147 V654" stroke="currentColor" stroke-width="1.3" fill="none" marker-end="url(#b)"/>
        <path d="M401 620 V654" stroke="#A8322A" stroke-width="1.3" fill="none" marker-end="url(#bd)"/>

        <text x="560" y="632" font-family="JetBrains Mono, monospace" font-size="8.5" fill="#7C8894" letter-spacing=".8">BUILD AND DEPLOY</text>
        <g fill="none" stroke="#7C8894" stroke-width="1.2">
          <rect x="560" y="658" width="140" height="66" rx="3"/>
          <rect x="726" y="658" width="140" height="66" rx="3"/>
          <rect x="892" y="658" width="118" height="66" rx="3"/>
        </g>
        <g font-family="Archivo, sans-serif" font-size="11" fill="#46525F" text-anchor="middle">
          <text x="630" y="682">Cloud Build</text>
          <text x="796" y="682">Artifact Registry</text>
          <text x="951" y="682">Cloud Run</text>
        </g>
        <g font-family="JetBrains Mono, monospace" font-size="8" fill="#7C8894" text-anchor="middle">
          <text x="630" y="700">from source</text>
          <text x="796" y="700">nav-sentinel image</text>
          <text x="951" y="700">new revision</text>
        </g>
        <g stroke="#7C8894" stroke-width="1.2" fill="none" marker-end="url(#bf)">
          <path d="M700 691 H722"/>
          <path d="M866 691 H888"/>
        </g>

        <text x="30" y="762" font-family="JetBrains Mono, monospace" font-size="8" fill="#7C8894">Two auth layers on ingress: Cloud Run rejects anonymous callers, and the handler verifies the OIDC token audience — a push that skips either is refused, not logged and accepted.</text>
        <text x="30" y="778" font-family="JetBrains Mono, monospace" font-size="8" fill="#7C8894">Every arrow crossing out of the container is a gateway call. There is no second path to data, which is what makes the policy list above enforceable rather than advisory.</text>
        <text x="30" y="794" font-family="JetBrains Mono, monospace" font-size="8" fill="#7C8894">Local runs use the same code and the same control plane; only the credential source and the repository backend differ (Application Default Credentials from gcloud, in-memory store).</text>
      </svg>
