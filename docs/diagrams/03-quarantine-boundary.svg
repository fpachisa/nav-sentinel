<svg xmlns="http://www.w3.org/2000/svg" color="#10151C" font-family="Archivo, Helvetica Neue, Arial, sans-serif" viewBox="0 0 1040 340" role="img"
        aria-label="An untrusted EDGAR filing passes through windowed Model Armor screening into an extractor that holds no tools, no identity and no memory and emits only typed values. Those values cross the trust boundary to the investigator, which never sees the prose. Value cross-checks and human approval sit behind it.">
        <title>NAV Sentinel — the quarantine boundary</title>
  <defs>
          <marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
          </marker>
          <marker id="cd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0 0 L10 5 L0 10 z" fill="#A8322A"/>
          </marker>
          <marker id="cc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0 0 L10 5 L0 10 z" fill="#2C6E5A"/>
          </marker>
        </defs>
        <rect x="0" y="0" width="1040" height="340" fill="#F1F4F7"/>

        <text x="24" y="26" font-family="JetBrains Mono, monospace" font-size="9" fill="#A8322A" letter-spacing="1.2">UNTRUSTED — ATTACKER-CONTROLLABLE PROSE</text>
        <text x="606" y="26" font-family="JetBrains Mono, monospace" font-size="9" fill="#2C6E5A" letter-spacing="1.2">PRIVILEGED — TOOLS, IDENTITY, AUTHORITY</text>

        <line x1="586" y1="36" x2="586" y2="304" stroke="#10151C" stroke-width="2.5"/>
        <text x="586" y="322" font-family="Archivo, sans-serif" font-size="11" font-weight="700" fill="currentColor" text-anchor="middle" letter-spacing=".06em">TRUST BOUNDARY</text>

        <rect x="24" y="70" width="150" height="72" rx="3" fill="none" stroke="#A8322A" stroke-width="1.5"/>
        <text x="99" y="96" font-family="Archivo, sans-serif" font-size="12" fill="#A8322A" text-anchor="middle">EDGAR filing</text>
        <text x="99" y="112" font-family="JetBrains Mono, monospace" font-size="8.5" fill="#A8322A" text-anchor="middle">38 KB–1 MB</text>
        <text x="99" y="126" font-family="JetBrains Mono, monospace" font-size="8.5" fill="#A8322A" text-anchor="middle">issuer-authored</text>

        <rect x="216" y="70" width="160" height="72" rx="3" fill="none" stroke="#A8322A" stroke-width="1.5"/>
        <text x="296" y="96" font-family="Archivo, sans-serif" font-size="12" fill="#A8322A" text-anchor="middle">Model Armor</text>
        <text x="296" y="112" font-family="JetBrains Mono, monospace" font-size="8.5" fill="#A8322A" text-anchor="middle">1 KB windows</text>
        <text x="296" y="126" font-family="JetBrains Mono, monospace" font-size="8.5" fill="#A8322A" text-anchor="middle">500 B overlap</text>

        <rect x="418" y="60" width="150" height="92" rx="3" fill="none" stroke="currentColor" stroke-width="1.6"/>
        <text x="493" y="84" font-family="Archivo, sans-serif" font-size="12" font-weight="600" fill="currentColor" text-anchor="middle">Extractor</text>
        <g font-family="JetBrains Mono, monospace" font-size="8.5" fill="#46525F" text-anchor="middle">
          <text x="493" y="102">no tools</text>
          <text x="493" y="116">no identity</text>
          <text x="493" y="130">no memory</text>
          <text x="493" y="144">typed output only</text>
        </g>

        <rect x="636" y="70" width="170" height="72" rx="3" fill="none" stroke="#2C6E5A" stroke-width="1.5"/>
        <text x="721" y="96" font-family="Archivo, sans-serif" font-size="12" fill="#2C6E5A" text-anchor="middle">Investigator</text>
        <text x="721" y="112" font-family="JetBrains Mono, monospace" font-size="8.5" fill="#2C6E5A" text-anchor="middle">reasons over values,</text>
        <text x="721" y="126" font-family="JetBrains Mono, monospace" font-size="8.5" fill="#2C6E5A" text-anchor="middle">never over prose</text>

        <rect x="848" y="70" width="168" height="72" rx="3" fill="none" stroke="#2C6E5A" stroke-width="1.5"/>
        <text x="932" y="96" font-family="Archivo, sans-serif" font-size="12" fill="#2C6E5A" text-anchor="middle">Cross-checks</text>
        <text x="932" y="112" font-family="JetBrains Mono, monospace" font-size="8.5" fill="#2C6E5A" text-anchor="middle">books and records,</text>
        <text x="932" y="126" font-family="JetBrains Mono, monospace" font-size="8.5" fill="#2C6E5A" text-anchor="middle">plausibility bounds</text>

        <g stroke="#A8322A" stroke-width="1.5" fill="none" marker-end="url(#cd)" color="#A8322A">
          <line x1="174" y1="106" x2="210" y2="106"/>
          <line x1="376" y1="106" x2="412" y2="106"/>
        </g>
        <line x1="568" y1="106" x2="630" y2="106" stroke="#2C6E5A" stroke-width="2" fill="none" marker-end="url(#cc)" color="#2C6E5A"/>
        <line x1="806" y1="106" x2="842" y2="106" stroke="#2C6E5A" stroke-width="1.5" fill="none" marker-end="url(#cc)" color="#2C6E5A"/>


        <rect x="636" y="196" width="380" height="76" rx="3" fill="none" stroke="#7C8894" stroke-width="1.1" stroke-dasharray="4 3"/>
        <text x="826" y="218" font-family="Archivo, sans-serif" font-size="11" fill="#46525F" text-anchor="middle" font-weight="600">Why a second layer exists</text>
        <text x="826" y="236" font-family="JetBrains Mono, monospace" font-size="8.5" fill="#46525F" text-anchor="middle">the extractor stops instruction injection —</text>
        <text x="826" y="250" font-family="JetBrains Mono, monospace" font-size="8.5" fill="#46525F" text-anchor="middle">it cannot stop a filing stating a false</text>
        <text x="826" y="264" font-family="JetBrains Mono, monospace" font-size="8.5" fill="#46525F" text-anchor="middle">withholding rate, so values are cross-checked</text>
        <line x1="932" y1="142" x2="932" y2="192" stroke="#7C8894" stroke-width="1" stroke-dasharray="3 3" fill="none" marker-end="url(#c)" color="#7C8894"/>
      
        <!-- drawn last, over a ground halo: the label annotates the crossing itself -->
        <rect x="571" y="86" width="62" height="13" fill="#F1F4F7"/>
        <text x="602" y="96" font-family="JetBrains Mono, monospace" font-size="8" fill="#2C6E5A" text-anchor="middle">typed values</text>
      </svg>
