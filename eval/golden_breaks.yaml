notes: 'Corrections are signed as the amount to add to the accounting book. The generator refuses to emit
  a cycle unless *posting* every declared correction onto the accounting side reconciles it exactly to
  the custodian''s. Each correction is derived from its scenario''s own parameters -- a published rate
  difference, a withholding percentage, a trade consideration -- not by subtracting one book from the
  other, so that assertion is not an identity.


  Summing the corrections after translating each to base currency is a weaker, different test and lands
  within one cent: money(a/r) - money(b/r) is not money((a-b)/r), and a foreign-currency correction rounds
  once while the balance it affects rounds once too. Posting-and-recomputing avoids the double rounding;
  the summed form is quoted with a two-cent tolerance and should not be tightened, because the residue
  is arithmetic, not error.


  Three of the six scenarios in the current cycle carry no monetary correction: a quantity-only split,
  a timing difference that is not an error, and a failed trade whose two legs net to zero.'
